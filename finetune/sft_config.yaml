### LlamaFactory SFT 微调配置
### 项目: 医疗分诊智能体系统
### 模型: Qwen2-1.5B-Instruct (可根据显存调整)

### ===== 模型配置 =====
model_name_or_path: Qwen/Qwen2-1.5B-Instruct
# 备选模型 (需要更多显存):
# model_name_or_path: Qwen/Qwen2-7B-Instruct
# model_name_or_path: Qwen/Qwen2.5-7B-Instruct

### ===== 微调方法 =====
stage: sft
do_train: true
finetuning_type: lora

### ===== LoRA 配置 =====
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### ===== 数据集配置 =====
dataset_dir: .
dataset: medical_triage
template: qwen
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 4

### ===== 输出配置 =====
output_dir: ./saves/medical-triage-lora
logging_dir: ./logs
overwrite_output_dir: true

### ===== 训练参数 =====
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
num_train_epochs: 3
max_grad_norm: 1.0
warmup_ratio: 0.1
lr_scheduler_type: cosine
gradient_checkpointing: true

### ===== 精度与优化 =====
bf16: false
fp16: true

### ===== 日志与保存 =====
logging_steps: 10
save_strategy: steps
save_steps: 100
save_total_limit: 3

### ===== 评估配置 =====
val_size: 0.05
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100

### ===== 其他配置 =====
ddp_timeout: 180000000
report_to: none
